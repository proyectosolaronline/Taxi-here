<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAXI LED</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #rotator {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  @media (orientation: portrait) {
    #rotator {
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -50vw;
      margin-left: -50vh;
    }
  }

  #led-screen {
    width: 100%;
    height: 100%;
    background: #000;
    position: relative;
    overflow: hidden;
  }

  #led-text {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    color: #ffee00;
  }
</style>
</head>
<body>

<div id="rotator">
  <div id="led-screen">
    <div id="led-text">TAXI</div>
  </div>
</div>

<a id="edit-btn" href="editor.html" style="position:fixed;top:12px;left:12px;padding:8px 14px;border-radius:20px;border:none;background:#222;color:#ffee00;font-size:12px;font-weight:bold;font-family:Arial,sans-serif;z-index:999;opacity:0.55;text-decoration:none;">EDITAR</a>

<div id="controls" style="position:fixed;bottom:12px;right:12px;display:flex;gap:8px;z-index:999;opacity:0.55;">
  <button id="btn-minus" style="width:42px;height:42px;border-radius:50%;border:none;background:#222;color:#ffee00;font-size:20px;font-weight:bold;font-family:Arial,sans-serif;">-</button>
  <button id="btn-plus" style="width:42px;height:42px;border-radius:50%;border:none;background:#222;color:#ffee00;font-size:20px;font-weight:bold;font-family:Arial,sans-serif;">+</button>
</div>

<script>
  const screenEl = document.getElementById('led-screen');
  const textEl = document.getElementById('led-text');

  const params = new URLSearchParams(window.location.search);
  const msgParam = params.get('msg');
  if (msgParam && msgParam.trim().length > 0) {
    textEl.textContent = msgParam.toUpperCase();
  }

  let baseFontVh = 58.5; // tamano deseado por el usuario (ajustable con +/-)
  const borderColors = ['#000000', '#0033ff', '#ffffff'];
  let currentAnim = null;

  function randomBorderColor() {
    return borderColors[Math.floor(Math.random() * borderColors.length)];
  }

  function applyBorder() {
    const c = randomBorderColor();
    textEl.style.textShadow =
      '-2px -2px 0 ' + c + ',' +
      ' 2px -2px 0 ' + c + ',' +
      '-2px  2px 0 ' + c + ',' +
      ' 2px  2px 0 ' + c + ',' +
      '-3px  0px 0 ' + c + ',' +
      ' 3px  0px 0 ' + c + ',' +
      ' 0px -3px 0 ' + c + ',' +
      ' 0px  3px 0 ' + c;
  }

  function containerWidth() {
    return screenEl.clientWidth;
  }

  // Ajusta el tamano de fuente para que el mensaje COMPLETO quepa en la pantalla
  // cuando se muestra fijo (parpadeo), respetando mobile-first (nunca se corta).
  function fitFontForFullDisplay() {
    textEl.style.fontSize = baseFontVh + 'vh';
    const maxWidth = containerWidth() * 0.94;
    let width = textEl.offsetWidth;
    if (width > maxWidth) {
      const scale = maxWidth / width;
      const adjustedVh = baseFontVh * scale;
      textEl.style.fontSize = adjustedVh + 'vh';
    }
  }

  // Para el scroll usamos SIEMPRE el tamano base pedido por el usuario (grande),
  // aunque el texto sea mas ancho que la pantalla -- eso es normal en un letrero scroll.
  function useScrollFontSize() {
    textEl.style.fontSize = baseFontVh + 'vh';
  }

  document.getElementById('btn-plus').addEventListener('click', () => {
    baseFontVh = Math.min(baseFontVh + 5, 95);
  });

  document.getElementById('btn-minus').addEventListener('click', () => {
    baseFontVh = Math.max(baseFontVh - 5, 15);
  });

  function cancelCurrentAnim() {
    if (currentAnim) {
      currentAnim.cancel();
      currentAnim = null;
    }
  }

  function startScrollPass(onDone) {
    applyBorder();
    useScrollFontSize();
    const cw = containerWidth();
    const tw = textEl.offsetWidth;

    // Empieza totalmente fuera a la derecha y termina totalmente fuera a la izquierda,
    // asi el ULTIMO caracter tambien pasa completo por la pantalla.
    const startX = cw;
    const endX = -tw;

    textEl.style.transform = 'translateY(-50%) translateX(' + startX + 'px)';

    // duracion proporcional a la distancia recorrida para mantener velocidad constante
    const distance = startX - endX;
    const pxPerSecond = 900; // velocidad del scroll (rapido)
    const durationMs = Math.max((distance / pxPerSecond) * 1000, 800);

    cancelCurrentAnim();
    currentAnim = textEl.animate(
      [
        { transform: 'translateY(-50%) translateX(' + startX + 'px)' },
        { transform: 'translateY(-50%) translateX(' + endX + 'px)' }
      ],
      { duration: durationMs, easing: 'linear', fill: 'forwards' }
    );

    currentAnim.onfinish = () => {
      currentAnim = null;
      if (onDone) onDone();
    };
  }

  function runScrollCycle(times, onAllDone) {
    let count = 0;
    function next() {
      count++;
      if (count < times) {
        startScrollPass(next);
      } else {
        if (onAllDone) onAllDone();
      }
    }
    startScrollPass(next);
  }

  function startBlink() {
    fitFontForFullDisplay();
    const cw = containerWidth();
    textEl.style.transform = 'translateY(-50%) translateX(' + (cw / 2 - textEl.offsetWidth / 2) + 'px)';

    let blinkCount = 0;
    const maxBlinks = 3;
    const blinkInterval = setInterval(() => {
      applyBorder();
      textEl.style.opacity = (textEl.style.opacity === '0') ? '1' : '0';
      blinkCount++;
      if (blinkCount >= maxBlinks * 2) {
        clearInterval(blinkInterval);
        textEl.style.opacity = '1';
        runCycle();
      }
    }, 500);
  }

  function runCycle() {
    runScrollCycle(3, () => {
      startBlink();
    });
  }

  // Reinicia el ciclo si el usuario cambia el tamano con +/-, para recalcular anchos
  let restartTimeout = null;
  function scheduleRestart() {
    clearTimeout(restartTimeout);
    restartTimeout = setTimeout(() => {
      cancelCurrentAnim();
      runCycle();
    }, 150);
  }

  document.getElementById('btn-plus').addEventListener('click', scheduleRestart);
  document.getElementById('btn-minus').addEventListener('click', scheduleRestart);

  window.addEventListener('resize', () => {
    scheduleRestart();
  });

  runCycle();
</script>

</body>
</html>
