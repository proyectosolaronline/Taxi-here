<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAXI LED</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #rotator {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  @media (orientation: portrait) {
    #rotator {
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -50vw;
      margin-left: -50vh;
    }
  }

  #led-screen {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  #led-text {
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 58.5vh;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
    position: absolute;
    left: 100%;
    color: #ffee00;
  }

  #led-text.scroll {
    animation: scrollLeft 2.5s linear;
  }

  #led-text.center {
    left: 50%;
    transform: translateX(-50%);
  }

  #led-text.blink {
    animation: blink 0.5s steps(1) infinite;
  }

  @keyframes scrollLeft {
    from { left: 100%; transform: translateX(0); }
    to { left: -60%; transform: translateX(0); }
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #controls {
    position: fixed;
    bottom: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 999;
    opacity: 0.55;
  }

  #controls button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #222;
    color: #ffee00;
    font-size: 20px;
    font-weight: bold;
    font-family: Arial, sans-serif;
  }

  #controls button:active {
    background: #444;
  }

  #qr-btn {
    position: fixed;
    bottom: 12px;
    left: 12px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #222;
    color: #ffee00;
    font-size: 11px;
    font-weight: bold;
    font-family: Arial, sans-serif;
    z-index: 999;
    opacity: 0.55;
  }

  #qr-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  #qr-overlay.show {
    display: flex;
  }

  #qr-overlay img {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    width: 240px;
    height: 240px;
  }

  #qr-overlay p {
    color: #fff;
    font-family: Arial, sans-serif;
    margin-top: 16px;
    font-size: 14px;
  }

  #qr-close {
    margin-top: 20px;
    padding: 10px 24px;
    border-radius: 20px;
    border: none;
    background: #ffee00;
    color: #000;
    font-weight: bold;
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

<div id="rotator">
  <div id="led-screen">
    <div id="led-text">TAXI Cab</div>
  </div>
</div>

<div id="controls">
  <button id="btn-minus">-</button>
  <button id="btn-plus">+</button>
</div>

<button id="qr-btn">QR</button>

<div id="qr-overlay">
  <img id="qr-img" src="" alt="QR">
  <p>Escanea para compartir</p>
  <button id="qr-close">Cerrar</button>
</div>

<script>
  const textEl = document.getElementById('led-text');
  let scrollCount = 0;
  const maxScrolls = 3;
  let fontSizeVh = 58.5;

  const borderColors = ['#000000', '#0033ff', '#ffffff'];

  function randomBorderColor() {
    return borderColors[Math.floor(Math.random() * borderColors.length)];
  }

  // Contorno via text-shadow (metodo estable, sin lineas cruzadas)
  function applyBorder() {
    const c = randomBorderColor();
    textEl.style.textShadow =
      '-2px -2px 0 ' + c + ',' +
      ' 2px -2px 0 ' + c + ',' +
      '-2px  2px 0 ' + c + ',' +
      ' 2px  2px 0 ' + c + ',' +
      '-3px  0px 0 ' + c + ',' +
      ' 3px  0px 0 ' + c + ',' +
      ' 0px -3px 0 ' + c + ',' +
      ' 0px  3px 0 ' + c;
  }

  function applyFontSize() {
    textEl.style.fontSize = fontSizeVh + 'vh';
  }

  document.getElementById('btn-plus').addEventListener('click', () => {
    fontSizeVh = Math.min(fontSizeVh + 5, 95);
    applyFontSize();
  });

  document.getElementById('btn-minus').addEventListener('click', () => {
    fontSizeVh = Math.max(fontSizeVh - 5, 15);
    applyFontSize();
  });

  function startScroll() {
    applyBorder();
    textEl.classList.remove('center', 'blink');
    textEl.style.left = '100%';
    textEl.style.transform = 'translateX(0)';
    void textEl.offsetWidth;
    textEl.classList.add('scroll');
  }

  textEl.addEventListener('animationend', (e) => {
    if (e.animationName === 'scrollLeft') {
      scrollCount++;
      textEl.classList.remove('scroll');
      if (scrollCount < maxScrolls) {
        startScroll();
      } else {
        scrollCount = 0;
        startBlink();
      }
    }
  });

  function startBlink() {
    applyBorder();
    textEl.classList.add('center');
    textEl.style.left = '';
    textEl.style.transform = '';
    textEl.classList.add('blink');
    setTimeout(stopBlinkCheck, 3000);
  }

  function stopBlinkCheck() {
    textEl.classList.remove('blink', 'center');
    textEl.style.opacity = 1;
    startScroll();
  }

  // Arranca de inmediato, sin depender de eventos load
  applyFontSize();
  startScroll();

  // QR
  const qrBtn = document.getElementById('qr-btn');
  const qrOverlay = document.getElementById('qr-overlay');
  const qrImg = document.getElementById('qr-img');
  const qrClose = document.getElementById('qr-close');

  qrBtn.addEventListener('click', () => {
    const shareUrl = window.location.href;
    qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(shareUrl);
    qrOverlay.classList.add('show');
  });

  qrClose.addEventListener('click', () => {
    qrOverlay.classList.remove('show');
  });
</script>

</body>
</html>
