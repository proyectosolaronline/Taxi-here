<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAXI LED</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #rotator {
    width: 100vw;
    height: 100vh;
    position: relative;
  }

  @media (orientation: portrait) {
    #rotator {
      width: 100vh;
      height: 100vw;
      transform: rotate(90deg);
      transform-origin: center center;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -50vw;
      margin-left: -50vh;
    }
  }

  #led-screen {
    width: 100%;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  #led-text {
    color: #ffee00;
    font-family: 'Arial Black', Arial, sans-serif;
    font-weight: 900;
    font-size: 58.5vh;
    line-height: 1;
    letter-spacing: 0.02em;
    text-shadow:
      0 0 20px #ffee00,
      0 0 40px #ffee00,
      0 0 80px #fff200;
    white-space: nowrap;
    position: absolute;
    left: 100%;
  }

  #led-text.scroll {
    animation: scrollLeft 2.5s linear;
  }

  #led-text.center {
    left: 50%;
    transform: translateX(-50%);
  }

  #led-text.blink {
    animation: blink 0.5s steps(1) infinite;
  }

  @keyframes scrollLeft {
    from { left: 100%; transform: translateX(0); }
    to { left: -50%; transform: translateX(0); }
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #controls {
    position: fixed;
    bottom: 12px;
    right: 12px;
    display: flex;
    gap: 8px;
    z-index: 999;
    opacity: 0.55;
  }

  #controls button {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #222;
    color: #ffee00;
    font-size: 20px;
    font-weight: bold;
    font-family: Arial, sans-serif;
  }

  #controls button:active {
    background: #444;
  }
</style>
</head>
<body>

<div id="rotator">
  <div id="led-screen">
    <div id="led-text">TAXI</div>
  </div>
</div>

<div id="controls">
  <button id="btn-minus">-</button>
  <button id="btn-plus">+</button>
</div>

<script>
  const textEl = document.getElementById('led-text');
  let scrollCount = 0;
  const maxScrolls = 3;
  let fontSizeVh = 58.5;

  function applyFontSize() {
    textEl.style.fontSize = fontSizeVh + 'vh';
  }

  document.getElementById('btn-plus').addEventListener('click', () => {
    fontSizeVh = Math.min(fontSizeVh + 5, 95);
    applyFontSize();
  });

  document.getElementById('btn-minus').addEventListener('click', () => {
    fontSizeVh = Math.max(fontSizeVh - 5, 15);
    applyFontSize();
  });

  function startScroll() {
    textEl.classList.remove('center', 'blink');
    textEl.style.left = '100%';
    textEl.style.transform = 'translateX(0)';
    void textEl.offsetWidth;
    textEl.classList.add('scroll');
  }

  textEl.addEventListener('animationend', (e) => {
    if (e.animationName === 'scrollLeft') {
      scrollCount++;
      textEl.classList.remove('scroll');
      if (scrollCount < maxScrolls) {
        startScroll();
      } else {
        scrollCount = 0;
        startBlink();
      }
    }
  });

  function startBlink() {
    textEl.classList.add('center');
    textEl.style.left = '';
    textEl.style.transform = '';
    textEl.classList.add('blink');
    setTimeout(stopBlinkCheck, 3000);
  }

  function stopBlinkCheck() {
    textEl.classList.remove('blink', 'center');
    textEl.style.opacity = 1;
    startScroll();
  }

  startScroll();
</script>

</body>
</html>
