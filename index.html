<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI - Solo scroll + parpadeo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }

        #led-bar {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #taxi-text {
            font-size: 25vh;  /* letras muy grandes */
            font-weight: 900;
            letter-spacing: 10px;
            color: #ffcc00;
            text-shadow: 
                0 0 15px #ffcc00,
                0 0 30px #ffaa00,
                0 0 60px #ff8800,
                0 0 120px #ff5500;
            white-space: nowrap;
            line-height: 1;
            will-change: transform, opacity;
            padding-left: 20px;
        }

        /* Animación principal: scroll continuo */
        @keyframes scrollTaxi {
            0%   { transform: translateX(100vw); opacity: 1; }
            100% { transform: translateX(-100%); opacity: 1; }
        }

        /* Animación de parpadeo */
        @keyframes blinkTaxi {
            0%, 100% { opacity: 1; }
            10% { opacity: 0; }
            20% { opacity: 1; }
            30% { opacity: 0; }
            40% { opacity: 1; }
            50% { opacity: 0; }
            60% { opacity: 1; }
            70% { opacity: 0; }
            80% { opacity: 1; }
            90% { opacity: 0; }
        }

        /* Ciclo completo: 35s scroll + 3s parpadeo = 38s total */
        #taxi-text {
            animation: 
                scrollTaxi 35s linear infinite,
                blinkTaxi 3s ease-in-out infinite;
            animation-delay: 0s, 35s;
            animation-duration: 35s, 3s;
            animation-timing-function: linear, ease-in-out;
            animation-iteration-count: infinite, infinite;
        }

        /* Rejilla LED sutil */
        #led-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                transparent 0px,
                transparent 12px,
                rgba(0,0,0,0.3) 12px,
                rgba(0,0,0,0.3) 14px
            );
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="led-bar">
        <span id="taxi-text">TAXI</span>
    </div>

    <script>
        // Forzar orientación horizontal
        if (screen.orientation) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        // Pantalla completa al tocar
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        // Ajustar velocidad según ancho (para que recorra bien en cualquier pantalla)
        const taxi = document.getElementById('taxi-text');
        
        function ajustarVelocidad() {
            const ancho = window.innerWidth;
            // La velocidad de scroll depende del ancho, pero mantenemos el ciclo de 35s
            taxi.style.animationDuration = '35s';
        }

        window.addEventListener('resize', ajustarVelocidad);
        ajustarVelocidad();
    </script>
</body>
</html>
