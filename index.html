<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI gigante - WELCOME pequeño</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }

        #led-bar {
            width: 100vw;
            height: 250px; /* más alto para la letra gigante */
            background: #000;
            border-top: 5px solid #333;
            border-bottom: 5px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 50px rgba(255,255,255,0.05);
        }

        /* Línea de TAXI (gigante) */
        #taxi-line {
            height: 160px;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        #taxi-text {
            font-size: 20vw;  /* 20% del ancho de pantalla = ENORME */
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffcc00;
            text-shadow: 
                0 0 15px #ffcc00,
                0 0 30px #ffaa00,
                0 0 60px #ff8800,
                0 0 120px #ff5500;
            animation: scrollTaxi 8s linear infinite;
            line-height: 1;
            padding-left: 20px;
        }

        /* Línea de WELCOME (pequeña, abajo) */
        #welcome-line {
            height: 60px;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
        }

        #welcome-text {
            font-size: 110px; /* como pediste, pero chico comparado con TAXI */
            font-weight: bold;
            letter-spacing: 4px;
            color: #00e5ff;
            text-shadow: 
                0 0 8px #00e5ff,
                0 0 15px #00b0ff,
                0 0 30px #0099ff;
            animation: scrollWelcome 8s linear infinite;
            line-height: 1;
            padding-left: 20px;
        }

        @keyframes scrollTaxi {
            0%   { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        @keyframes scrollWelcome {
            0%   { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* Rejilla LED */
        #led-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                transparent 0px,
                transparent 12px,
                rgba(0,0,0,0.4) 12px,
                rgba(0,0,0,0.4) 14px
            );
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="led-bar">
        <div id="taxi-line">
            <span id="taxi-text">TAXI</span>
        </div>
        <div id="welcome-line">
            <span id="welcome-text">WELCOME</span>
        </div>
    </div>

    <script>
        if (screen.orientation) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        // Ajustar velocidad según ancho
        const taxi = document.getElementById('taxi-text');
        const welcome = document.getElementById('welcome-text');

        function ajustarVelocidad() {
            const ancho = window.innerWidth;
            taxi.style.animationDuration = (ancho / 200) + 's';
            welcome.style.animationDuration = (ancho / 200) + 's';
        }

        window.addEventListener('resize', ajustarVelocidad);
        ajustarVelocidad();
    </script>
</body>
</html>
