<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAXI gigante - Bienvenidos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', Courier, monospace;
        }

        #led-bar {
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            border: none;
        }

        /* ====== TAXI GIGANTE (90% de la pantalla) ====== */
        #taxi-container {
            height: 90vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            white-space: nowrap;
        }

        #taxi-text {
            font-size: 22vh;  /* 22% de la altura = ocupa casi todo el alto */
            font-weight: 900;
            letter-spacing: 8px;
            color: #ffcc00;
            text-shadow: 
                0 0 15px #ffcc00,
                0 0 30px #ffaa00,
                0 0 60px #ff8800,
                0 0 120px #ff5500;
            animation: scrollTaxi 9s linear infinite;
            line-height: 1;
            padding-left: 20px;
            will-change: transform;
        }

        /* ====== MENSAJE PEQUEÑO (10% abajo) ====== */
        #mensaje-container {
            height: 10vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            white-space: nowrap;
            background: #000;
        }

        #mensaje-text {
            font-size: 3.5vh;  /* pequeño, proporcional al 10% */
            font-weight: bold;
            letter-spacing: 3px;
            color: #00e5ff;
            text-shadow: 
                0 0 6px #00e5ff,
                0 0 12px #00b0ff,
                0 0 24px #0099ff;
            animation: scrollMensaje 12s linear infinite;
            line-height: 1;
            padding-left: 20px;
        }

        /* Animaciones */
        @keyframes scrollTaxi {
            0%   { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        @keyframes scrollMensaje {
            0%   { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* Rejilla LED (opcional, sutil) */
        #led-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                transparent 0px,
                transparent 12px,
                rgba(0,0,0,0.3) 12px,
                rgba(0,0,0,0.3) 14px
            );
            pointer-events: none;
            z-index: 3;
        }

        /* Línea divisoria entre TAXI y mensaje */
        #led-bar::before {
            content: "";
            position: absolute;
            bottom: 10vh;
            left: 0;
            width: 100%;
            height: 2px;
            background: #333;
            z-index: 4;
        }
    </style>
</head>
<body>
    <div id="led-bar">
        <!-- TAXI GIGANTE -->
        <div id="taxi-container">
            <span id="taxi-text">TAXI</span>
        </div>
        
        <!-- MENSAJE PEQUEÑO -->
        <div id="mensaje-container">
            <span id="mensaje-text">BIENVENIDOS, ESTAMOS PARA SERVIRTE</span>
        </div>
    </div>

    <script>
        // Forzar orientación horizontal
        if (screen.orientation) {
            screen.orientation.lock('landscape').catch(() => {});
        }

        // Pantalla completa al tocar
        document.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        // Ajustar velocidades según tamaño de pantalla
        const taxi = document.getElementById('taxi-text');
        const mensaje = document.getElementById('mensaje-text');

        function ajustarVelocidad() {
            const ancho = window.innerWidth;
            taxi.style.animationDuration = (ancho / 180) + 's';
            mensaje.style.animationDuration = (ancho / 150) + 's';
        }

        window.addEventListener('resize', ajustarVelocidad);
        ajustarVelocidad();
    </script>
</body>
</html>
